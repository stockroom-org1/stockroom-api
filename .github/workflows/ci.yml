name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Ref type: $GITHUB_REF_TYPE"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Verify AWS role ARN
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          EXPECTED="arn:aws:iam::055143528572:role/nchandran-stockroom"

          if [ "$AWS_ROLE_ARN" = "$EXPECTED" ]; then
            echo "AWS_ROLE_ARN matches expected role"
          else
            echo "AWS_ROLE_ARN does NOT match expected role"
            exit 1
          fi

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')
      
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
      
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
      
          echo "$PAYLOAD" | base64 -d | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            ref,
            ref_type
          }'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract image tags
        id: tags
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          SHA_TAG=$ECR_REGISTRY/stockroom-api:${{ github.sha }}
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref_name }}
            echo "version_tag=$ECR_REGISTRY/stockroom-api:$VERSION" >> $GITHUB_OUTPUT
            echo "latest_tag=$ECR_REGISTRY/stockroom-api:latest" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build image
        run: docker build -t ${{ steps.tags.outputs.sha_tag }} .

      # NOTE: Veracode Repo Tools inserts an AST scan step here that submits
      # findings to Trust Authority and records an Asset Snapshot ID.

      - name: Push SHA tag
        run: docker push ${{ steps.tags.outputs.sha_tag }}

      - name: Push semver and latest tags (releases only)
        if: steps.tags.outputs.is_release == 'true'
        run: |
          docker tag ${{ steps.tags.outputs.sha_tag }} ${{ steps.tags.outputs.version_tag }}
          docker tag ${{ steps.tags.outputs.sha_tag }} ${{ steps.tags.outputs.latest_tag }}
          docker push ${{ steps.tags.outputs.version_tag }}
          docker push ${{ steps.tags.outputs.latest_tag }}
